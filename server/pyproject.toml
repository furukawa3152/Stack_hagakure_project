[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hagakure"
version = "0.1.0"
description = "M5Stack Core2 向けはがくれ君の Mac/PC 側 Gateway（Phase 1: エコーと表情プレビュー）"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12",
  "PyYAML>=6",
  "google-genai>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hagakure-gateway = "hagakure.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
